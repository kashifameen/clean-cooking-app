name: Build Clean Cooking Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest public web assets into Android project
        run: |
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www
          cp -r public/* android-app/app/src/main/assets/www/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload Clean Cooking APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-cooking-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
